name: Validate site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:   # 允許手動觸發

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 檢查版面結構、來源分級與 post-id 完整性
        run: node scripts/validate-site.mjs

      - name: 檢查網站草稿與 markdown 存檔是否一致
        run: node scripts/sync-markdown.mjs --check
